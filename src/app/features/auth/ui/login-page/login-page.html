<div class="flex h-screen w-full items-center justify-center bg-slate-900">
  <form class="flex w-full max-w-sm flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="text-2xl font-bold text-white">Sign in</h1>
    @if (authService.error(); as error) {
      <p class="text-sm text-red-600">{{ error.message }}</p>
    }
    <gs-input
      id="login-email"
      name="email"
      label="Email"
      type="email"
      formControlName="email"
      autocomplete="email"
      [required]="true"
    />
    <gs-input
      id="login-password"
      name="password"
      label="Password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      [required]="true"
    />
    <button
      class="rounded bg-blue-600 px-4 py-2 font-medium text-white disabled:opacity-50"
      type="submit"
      [disabled]="form.invalid || authService.isLoading()"
    >
      Sign in
    </button>
    <div class="text-sm font-medium text-body">
      Not registered? <a href="#" class="text-fg-brand hover:underline">Create account</a>
    </div>
  </form>
</div>
