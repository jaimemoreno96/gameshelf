<li
  class="flex flex-col gap-2 bg-slate-900 shrink-0 w-72 min-w-72 h-fit max-h-4/5 rounded-xl shadow-md border border-slate-600"
>
  <div class="flex flex-col gap-2 w-full h-full">
    <div class="mx-4 mt-2">
      <h3 class="text-sm font-semibold text-white cursor-pointer">
        {{ label }} ({{ backlogGames?.length }})
      </h3>
    </div>
    <ol
      cdkDropList
      [cdkDropListData]="backlogGames"
      class="backlog-column flex flex-col gap-2 w-full h-full min-h-2 px-2 overflow-y-auto overflow-x-hidden"
      (cdkDropListEntered)="listEntered($event)"
      (cdkDropListDropped)="drop($event)"
    >
      @for (backlogGame of backlogGames; track backlogGame.id) {
        <backlog-game-item cdkDrag [cdkDragData]="backlogGame" [backlogGame]="backlogGame" />
      }
    </ol>
    <Button
      class="bg-transparent text-gray-400 hover:text-white hover:bg-gray-600 rounded-md p-2 transition-colors duration-200 cursor-pointer mx-2 mb-2"
    >
      <p class="text-sm font-medium w-fit">+ Add game</p>
    </Button>
  </div>
</li>
