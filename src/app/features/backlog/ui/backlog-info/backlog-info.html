<div class="w-full h-auto flex justify-between items-center px-4 py-2 bg-slate-800 shadow-sm">
  <h1 class="text-2xl font-bold text-white">GameShelf</h1>
  <div class="flex items-center gap-2">
    <span class="text-lg text-white">Welcome, {{ userName }}!</span>
    <button
      class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded hover:cursor-pointer"
      (click)="isAddGameDialogOpen = true"
    >
      + Add game
    </button>
  </div>
</div>
<gs-dialog [(open)]="isAddGameDialogOpen" title="Add Game">
  <div dialog-header>
    <h2 class="text-lg font-semibold text-white">Add Game</h2>
  </div>
  <app-add-game-form />
  <div class="flex justify-end gap-2 p-4" dialog-footer>
    <button
      class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded hover:cursor-pointer"
      (click)="isAddGameDialogOpen = false"
    >
      Cancel
    </button>
    <button
      class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded hover:cursor-pointer"
      (click)="saveGame()"
    >
      Save
    </button>
  </div>
</gs-dialog>
